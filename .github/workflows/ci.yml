name: CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            KuGouMusicApi/package-lock.json
      - run: npm run setup
      - run: npm run lint
      - run: npm test
      - run: cp .env.example .env
      - run: docker compose config --quiet

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait --wait-timeout 120
      - run: curl --fail http://127.0.0.1:3000/healthz
      - if: failure()
        run: docker compose logs --no-color --tail=100
      - if: always()
        run: docker compose down --volumes
